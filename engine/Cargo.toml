[package]
name = "st-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The test record kinds, for measuring; a build with it has no Node-API binding.
measure = []

[dependencies]
napi = { version = "3.14.0", default-features = false, features = ["napi6"] }
crc32c = "0.6.8"
napi-derive = "3.6.10"
unicode-normalization = "0.1.25"

# The crate's own allocator on native builds (wasm keeps its default): it returns freed memory to the system
# instead of holding each engine thread's peak, as glibc's per-thread arenas do. Node's own memory isn't affected.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[[example]]
name = "measure"
required-features = ["measure"]

[[example]]
name = "search"
required-features = ["measure"]

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
